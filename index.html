<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeraShop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">🛍️ ZeraShop</div>

    <input
      type="text"
      id="search"
      placeholder="Search products..."
      onkeyup="searchProducts()">

    <div class="cart">
      🛒 Cart
      <span id="cart-count">0</span>
    </div>
  </header>

  <nav class="categories">
    <button>All</button>
    <button>Men</button>
    <button>Women</button>
    <button>Kids</button>
  </nav>

  <main>
    <div id="products" class="products"></div>
  </main>

  <footer>
    <h3>ZeraShop</h3>
    <p>Quality Clothes at Best Prices</p>
    <p>© 2026 ZeraShop. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
