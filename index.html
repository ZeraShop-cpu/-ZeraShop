<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DresseClub</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<header>

<nav class="container">

<div class="logo">
<h2>Dresse<span>club</span></h2>
</div>

<ul class="menu">
<li><a href="#">Features</a></li>
<li><a href="#">Club</a></li>
<li><a href="#">Chores</a></li>
</ul>

<a href="#" class="login-btn">Sign In / Sign Up</a>

</nav>

</header>

<section class="hero">

<div class="hero-left">

<h1>
Shopping to<br>
stay happy
</h1>

<p>
Find trending items at unbeatable prices
and enjoy a seamless online shopping
experience.
</p>

<div class="hero-buttons">

<a href="#" class="shop-btn">
Shop Now
</a>

<a href="#" class="play-btn">
<i class="fa-solid fa-play"></i>
</a>

</div>

<div class="experience">

<div class="circle">
<i class="fa-solid fa-play"></i>
</div>

<span>Experience joy of online now</span>

</div>

</div>

<div class="hero-center">

<img src="images/girl.png" alt="">

</div>

<div class="hero-right">

<div class="review-card">

<img src="images/profile.jpg">

<div>

<h4>Review</h4>

★★★★★

<p>5.4k Reviews</p>

</div>

</div>

<div class="stats">

<h2>100k</h2>

<span>Happy Customers</span>

<h2>1.5m</h2>

<span>Products Sold</span>

</div>

</div>

</section>

</body>
</html>
