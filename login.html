<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Zera Shop</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#dbeafe,#bfdbfe);
}

.login-box{

width:420px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.15);

}

.login-box h1{

text-align:center;
margin-bottom:10px;
color:#2563eb;

}

.login-box p{

text-align:center;
margin-bottom:30px;
color:#777;

}

.input{

margin-bottom:20px;

}

.input label{

display:block;
margin-bottom:8px;
font-weight:600;

}

.input input{

width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
font-size:16px;

}

.options{

display:flex;
justify-content:space-between;
margin-bottom:25px;
font-size:14px;

}

.options a{

text-decoration:none;
color:#2563eb;

}

button{

width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.signup{

margin-top:25px;
text-align:center;

}

.signup a{

color:#2563eb;
text-decoration:none;
font-weight:bold;

}

</style>

</head>

<body>

<div class="login-box">

<h1>Zera Shop</h1>

<p>Welcome Back</p>

<div class="input">

<label>Email</label>

<input type="email" placeholder="Enter your email">

</div>

<div class="input">

<label>Password</label>

<input type="password" placeholder="Enter your password">

</div>

<div class="options">

<label><input type="checkbox"> Remember me</label>

<a href="#">Forgot Password?</a>

</div>

<button>Login</button>

<div class="signup">

Don't have an account?

<a href="#">Create Account</a>

</div>

</div>

</body>
</html>
