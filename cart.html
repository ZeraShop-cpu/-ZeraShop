<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Zera Shop</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.cart{
width:90%;
margin:60px auto;
}

.cart h1{
margin-bottom:30px;
font-size:40px;
}

.cart-item{
display:flex;
align-items:center;
justify-content:space-between;
background:#fff;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.cart-item img{
width:100px;
height:100px;
object-fit:contain;
}

.details{
flex:1;
margin-left:20px;
}

.details h3{
margin-bottom:10px;
}

.price{
color:#2563eb;
font-weight:bold;
font-size:20px;
}

.remove{
background:#ef4444;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

.summary{
margin-top:40px;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.summary h2{
margin-bottom:20px;
}

.checkout{
width:100%;
padding:15px;
border:none;
background:#2563eb;
color:white;
font-size:18px;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

.checkout:hover{
background:#1d4ed8;
}

</style>

</head>

<body>

<header>

<div class="logo">
<img src="images/logo.png">
<h2>Zera Shop</h2>
</div>

<nav>
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<div class="icons">
<a href="login.html"><i class="fa-regular fa-user"></i></a>
<a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
</div>

</header>

<section class="cart">

<h1>Your Cart</h1>

<div class="cart-item">

<img src="images/product1.jpg">

<div class="details">
<h3>Wireless Headphones</h3>
<p class="price">$59.99</p>
</div>

<button class="remove">Remove</button>

</div>

<div class="cart-item">

<img src="images/product2.jpg">

<div class="details">
<h3>Smart Watch</h3>
<p class="price">$89.99</p>
</div>

<button class="remove">Remove</button>

</div>

<div class="summary">

<h2>Order Summary</h2>

<p>Subtotal: <strong>$149.98</strong></p>

<p>Shipping: <strong>Free</strong></p>

<h2>Total: $149.98</h2>

<button class="checkout">
Proceed to Checkout
</button>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
